<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#141318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Seva">
<title>Seva</title>
<!-- Seva pentru iPhone, în lucru: interiorul aplicației, făcut pe codul paginii de dar (../g/seva.js). Pagină de probă, nelegată de nicăieri. -->
<link rel="stylesheet" href="app.css?v=6">
</head>
<body data-view="board">

<!-- planșa de desen -->
<section id="v-board" class="view">
  <header class="top">
    <span id="build"></span>
    <span class="brand">SEVA</span>
    <button id="to-collection" class="pill right" type="button"></button>
  </header>
  <div id="stage" class="stage"><canvas id="board"></canvas></div>
  <footer class="bar">
    <p id="hint" class="hint">&nbsp;</p>
    <div class="buttons">
      <button id="clear" class="btn soft" type="button" hidden></button>
      <button id="compose" class="btn" type="button" hidden></button>
      <button id="keep" class="btn third" type="button" hidden></button>
      <button id="another" class="btn soft third" type="button" hidden></button>
      <button id="again" class="btn soft third" type="button" hidden></button>
      <button id="back-board" class="btn third" type="button" hidden></button>
      <button id="give" class="btn third" type="button" hidden></button>
    </div>
  </footer>
</section>

<!-- colecția -->
<section id="v-collection" class="view">
  <header class="top col">
    <button id="col-back" class="pill flow" type="button"></button>
    <div class="tabs">
      <button id="tab-kept" class="tab on" type="button"></button>
      <button id="tab-given" class="tab" type="button"></button>
    </div>
  </header>
  <div id="grid-wrap" class="scroll">
    <p id="col-empty" class="empty" hidden></p>
    <div id="grid"></div>
  </div>
</section>

<!-- un tablou din colecție, mare -->
<section id="v-viewer" class="view">
  <header class="top">
    <span id="view-from" class="from"></span>
    <button id="view-turn" class="pill right" type="button" hidden></button>
  </header>
  <div id="view-stage" class="stage"><div id="vcard"><canvas id="view"></canvas><canvas id="view-back-face"></canvas></div></div>
  <footer class="bar">
    <p class="hint none">&nbsp;</p>
    <div class="buttons">
      <button id="view-back" class="btn soft third" type="button"></button>
      <button id="view-give" class="btn third" type="button"></button>
      <button id="view-delete" class="btn soft third" type="button"></button>
    </div>
  </footer>
</section>

<!-- fereastra de întrebat -->
<div id="modal" hidden>
  <div class="sheet scroll" role="dialog" aria-modal="true">
    <h2 id="m-title"></h2>
    <p id="m-text"></p>
    <input id="m-input" type="text" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false" maxlength="40" hidden>
    <!-- spatele cărții poștale, la dăruit: un gând, top secret, ocazia -->
    <div id="m-gift" hidden>
      <textarea id="g-note" rows="2" maxlength="240" autocapitalize="sentences"></textarea>
      <label class="check"><input id="g-secret" type="checkbox"><span></span><b id="g-secret-t"></b></label>
      <label class="check"><input id="g-birthday" type="checkbox"><span></span><b id="g-birthday-t"></b></label>
      <label class="check" id="g-christmas-row"><input id="g-christmas" type="checkbox"><span></span><b id="g-christmas-t"></b></label>
    </div>
    <div class="m-buttons">
      <button id="m-cancel" class="btn soft" type="button" hidden></button>
      <button id="m-ok" class="btn" type="button"></button>
    </div>
  </div>
</div>

<div id="toast" hidden></div>

<script src="../g/seva.js?v=9"></script>
<script src="app.js?v=6"></script>
</body>
</html>
